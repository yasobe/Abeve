<body>
<title>טיק יומן מסחר</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app, max 560px, four tabs on a fixed bottom bar. Ink-navy trading desk with a brass accent. */
:root{
  --bg:#0D131E; --surface:#151D2B; --surface2:#1C2637; --line:#283447;
  --fg:#E7EBF3; --muted:#8E99AD; --accent:#E2A64A; --accent-ink:#1B1306; --accent-soft:rgba(226,166,74,.14);
  --up:#41C38E; --up-soft:rgba(65,195,142,.14); --down:#F2706C; --down-soft:rgba(242,112,108,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:"Rubik","Assistant",system-ui,sans-serif;
  --f-body:"Assistant","Rubik",system-ui,-apple-system,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EDF0F5; --surface:#FFFFFF; --surface2:#F4F6FA; --line:#D8DEE8;
  --fg:#111827; --muted:#5A6477; --accent:#A8690F; --accent-ink:#FFFFFF; --accent-soft:rgba(168,105,15,.10);
  --up:#11845A; --up-soft:rgba(17,132,90,.10); --down:#C7362F; --down-soft:rgba(199,54,47,.09);
  --shadow:0 10px 30px rgba(17,24,39,.12); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface2:#F4F6FA; --line:#D8DEE8;
  --fg:#111827; --muted:#5A6477; --accent:#A8690F; --accent-ink:#FFFFFF; --accent-soft:rgba(168,105,15,.10);
  --up:#11845A; --up-soft:rgba(17,132,90,.10); --down:#C7362F; --down-soft:rgba(199,54,47,.09);
  --shadow:0 10px 30px rgba(17,24,39,.12); color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.05rem;font-weight:600}
.eyebrow{font-size:.78rem;color:var(--muted);letter-spacing:.04em;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--up-soft);color:var(--up);border-color:transparent}
.chip.bad{background:var(--down-soft);color:var(--down);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pulse .dot{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pulse .dot{animation:none}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat .v{font-size:1.15rem}
.stat .k{font-size:.78rem;color:var(--muted)}
.big{font-size:2rem;font-weight:700;line-height:1.1}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--down)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.check:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn:active{transform:scale(.98)}
label.f{display:grid;gap:5px;font-size:.84rem;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--fg);min-height:44px;outline:none}
input[type=number]{font-family:var(--f-num);direction:ltr;text-align:right}
textarea{min-height:80px;resize:vertical}
input[autocapitalize="characters"]{text-transform:uppercase}
input,select{min-width:0;max-width:100%}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:700;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.seg button.L[aria-pressed="true"]{color:var(--up)} .seg button.S[aria-pressed="true"]{color:var(--down)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;transition:background .15s}
.check input:checked + .box{background:var(--accent);border-color:var(--accent)}
.check input:checked + .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked ~ span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit}
.trade{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-bottom:0;width:100%;text-align:start}
.trade:first-child{border-top:0}
.side{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.8rem}
.side.L{background:var(--up-soft);color:var(--up)} .side.S{background:var(--down-soft);color:var(--down)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:.72rem;padding:1px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--fg);font-size:.88rem}
.insight{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:.95rem}
.insight:first-child{border-top:0}
.insight b.i{flex:none;width:8px;height:8px;margin-top:8px;border-radius:50%;background:var(--muted)}
.insight.up b.i{background:var(--up)} .insight.down b.i{background:var(--down)} .insight.acc b.i{background:var(--accent)}
.result{display:grid;gap:4px;justify-items:center;text-align:center;padding:18px 12px;border-radius:14px;background:var(--surface2)}
.result .big{font-size:3rem;color:var(--accent)}
.warn{padding:10px 12px;border-radius:10px;background:var(--down-soft);color:var(--down);font-size:.9rem;font-weight:600}
.okmsg{padding:10px 12px;border-radius:10px;background:var(--up-soft);color:var(--up);font-size:.9rem;font-weight:600}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 6px;text-align:start;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:.76rem;color:var(--muted);font-weight:600;border-top:0}
.rem{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.rem:first-child{border-top:0}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:.8rem;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + span{background:var(--up)}
.switch input:checked + span::after{right:23px}
.rule{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .n{flex:none;font-family:var(--f-num);color:var(--accent);font-weight:700;width:22px}
.rule p{margin:0;flex:1;min-width:0}
.info{position:relative;display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);font:700 12px/1 var(--f-num);padding:0;margin-inline-start:4px;vertical-align:middle;cursor:pointer;flex:none}
.info::after{content:"";position:absolute;inset:-11px}
.infobody{display:grid;gap:10px;font-size:1rem;line-height:1.6}
.infobody p{margin:0}
.infobody .ex{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:.92rem}
.exrow{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:center}
img.shot{width:100%;max-height:220px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block}
img.shot.zoom{max-height:none;object-fit:contain;cursor:zoom-out}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:.72rem;color:var(--muted);text-align:center;font-weight:600}
.cal .d{aspect-ratio:1;border-radius:8px;background:var(--surface2);display:grid;align-content:center;justify-items:center;gap:1px;min-width:0;font-size:.72rem;line-height:1.1}
.cal .d.today{outline:1.5px solid var(--accent)}
.cal .d .a{font-family:var(--f-num);font-size:.62rem;font-weight:700;direction:ltr}
.cal .d.hol{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.links a{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--fg);text-decoration:none;min-width:0}
.links a b{font-family:var(--f-num);direction:ltr;text-align:right}
.links a span{font-size:.78rem;color:var(--muted)}
.tvbox{min-height:200px;border-radius:12px;overflow:hidden}
.tvbox.watchgrid{min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;overflow:visible}
.watchgrid>div{background:var(--surface2);border-radius:12px;overflow:hidden;min-width:0}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px;font-size:1.1rem;min-height:32px}
svg.chart{width:100%;height:auto;display:block}
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(5,8,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:min(520px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;justify-content:space-between}
.empty{padding:24px 8px;text-align:center;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:left;color:var(--muted)}
details[open] summary::after{content:"−"}
code.ics{display:block;max-height:140px;overflow:auto;font-family:var(--f-num);font-size:.7rem;background:var(--surface2);padding:8px;border-radius:8px;direction:ltr;text-align:left;white-space:pre}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}.result .big{font-size:2.5rem}}
</style>

<div class="app" id="app" dir="rtl" lang="he">
  <section class="view" id="v-today" data-view="today"></section>
  <section class="view" id="v-market" data-view="market" hidden></section>
  <section class="view" id="v-calc" data-view="calc" hidden></section>
  <section class="view" id="v-journal" data-view="journal" hidden></section>
  <section class="view" id="v-plan" data-view="plan" hidden></section>
</div>

<div class="tabs" dir="rtl">
  <nav aria-label="ניווט ראשי">
    <button class="tab" data-go="today" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 4v3M7 17v3M17 7v3M17 18v2"/><rect x="5" y="7" width="4" height="10" rx="1" fill="currentColor" fill-opacity=".18"/><rect x="15" y="10" width="4" height="8" rx="1"/></svg>היום</button>
    <button class="tab" data-go="market">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/><path d="M3 21h18"/></svg>שוק</button>
    <button class="tab" data-go="calc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8 7h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg>מחשבון</button>
    <button class="tab" data-go="journal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6z"/><path d="M6 3v18M10 8h5M10 12h5"/></svg>יומן</button>
    <button class="tab" data-go="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.5 20a1.7 1.7 0 0 0 3 0"/></svg>תוכנית</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" dir="rtl" role="status" hidden></div>

<script src="app.js"></script>

</body>
</html>
